name: OpenSpec
description: Run the OpenSpec command line at the one version the shared delivery workflow pins.
inputs:
  args:
    description: Arguments for the openspec command
    required: false
    default: validate --all --strict --no-interactive
  working-directory:
    description: Folder to run in
    required: false
    default: .
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        OPENSPEC_ARGS: ${{ inputs.args }}
      run: |
        version=$(node -p "require(process.argv[1]).dependencies['@fission-ai/openspec']" "$GITHUB_ACTION_PATH/../../package.json")
        echo "OpenSpec $version"
        # Rationale: the arguments are a fixed list written in the caller's workflow, split on spaces on purpose.
        npx --yes "@fission-ai/openspec@$version" $OPENSPEC_ARGS
